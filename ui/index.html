<link rel="stylesheet" href="nfsu2.css">
<style>
  /* FRSMiniMap - 3D minimap. Nothing is extracted from the game: it comes from
     the game's files at run time.
       http://nfsu2.tex/mod/<this mod>/maps/TRACKMAP<id>.dds
                                            the track map redrawn at 2048
                                            ("NFSU2 Detailed Map", JeansBig), shipped
                                            with the mod; if there is none, the game's:
       http://nfsu2.tex/TRACKMAP<id>        the original map, 512
                                            <id> and the framing come from the loaded
                                            track's TrackInfo (main.js, 'track')
       icons/PLAYER.svg, icons/PIN.svg      the player and the markers (mod art)
       icons/*-solid-full.svg               the pin icons (Font Awesome Free)
       http://nfsu2.data/L4RA/shops.json    the shops
       http://nfsu2.tex/MINIMAP_NORTH_INDICATOR
       http://nfsu2.data/L4RA/events.json   the race starts

     Layers:
       .view   the round crop, with the perspective
       .plane  the tilted ground; moves and turns under the car (place())
       .ground the map. One flat layer, so nothing is
               coplanar with anything else and fights over depth
       .ev     the events, standing on the ground, always facing the camera
       .routelayer the GPS route, just above the ground
       .rival  the rivals, lying on the ground, turned by each one's heading
       .edge   the nearest of each category out of view, pinned to the border
       .car    outside the 3D: that is what ends the flickering arrow, which was
               it fighting over depth with the plane, which passes exactly
               through it at the car's point */
  :host { all: initial; }

  .mm {
    --size: 300px;
    position: absolute;
    /* in place of the game's minimap, which main.js hides */
    left: 36px; bottom: 36px;
    width: var(--size); height: var(--size);
    display: none;
  }
  .mm.on { display: block; }
  .mm.paused { visibility: hidden; }   /* the game's pause menu is open */
  /* Rectangular, as GTA V's: wider than tall; the car keeps its place at 64%
     of the height. The fade is the round one's, along each axis: opaque to
     55% of the half size, 0.6 at 75%, gone at the border - two linear masks,
     intersected. */
  .mm.rect { width: 340px; height: 214px; }
  .mm.rect .view {
    --fade-x: linear-gradient(to right, transparent 0, rgba(0, 0, 0, 0.6) 12.5%, #000 22.5%,
                              #000 77.5%, rgba(0, 0, 0, 0.6) 87.5%, transparent 100%);
    --fade-y: linear-gradient(to bottom, transparent 0, rgba(0, 0, 0, 0.6) 12.5%, #000 22.5%,
                              #000 77.5%, rgba(0, 0, 0, 0.6) 87.5%, transparent 100%);
    -webkit-mask-image: var(--fade-x), var(--fade-y);
    mask-image: var(--fade-x), var(--fade-y);
    -webkit-mask-composite: source-in;
    mask-composite: intersect;
  }
  /* Solid edge, either shape: no fade, a dark outline and a soft shadow. */
  .mm.solid .view {
    -webkit-mask-image: none;
    mask-image: none;
    box-shadow: 0 0 0 2px rgba(6, 10, 12, 0.85), 0 3px 12px rgba(0, 0, 0, 0.5);
  }
  .mm.solid:not(.rect) .view { border-radius: 50%; }
  .mm.solid.rect .view { border-radius: 3px; }

  .view {
    position: absolute; inset: 0;
    overflow: hidden;
    background: #1d2b2f;
    perspective: 420px;
    perspective-origin: 50% 40%;
    /* No border: the map dissolves at the edges, as in Forza
       Horizon. Opaque up to 55% of the radius, gone at the rim. */
    --fade: radial-gradient(closest-side, #000 55%, rgba(0, 0, 0, 0.6) 75%, transparent 100%);
    -webkit-mask-image: var(--fade);
    mask-image: var(--fade);
  }

  .plane {
    position: absolute;
    /* the car's point on the radar: below the centre, to see more of what is
       ahead than of what is behind */
    left: 50%; top: 64%;
    width: 0; height: 0;
    transform-origin: 0 0;
    transform-style: preserve-3d;
    will-change: transform;
  }

  /* Q times the TRACKMAP in layout pixels, shrunk by the transform: Chromium
     rasterizes the layer at that size, and that is what keeps it sharp once
     tilted. See Q in the script. */
  .ground {
    position: absolute; left: 0; top: 0;
    /* the size comes from the script: 512 * Q */
  }
  .bitmap {
    position: absolute; inset: 0;
    background: 0 0 / 100% 100% no-repeat;   /* the image comes from pickMap() */
  }
  /* The markers: icons/PIN.svg, inlined in each one so the <circle> can take
     the category's colour (the pause map's colours,
     UI_InGame_WorldMap.fng). The pin's tip sits on the start point. */
  .ev {
    position: absolute; left: 0; top: 0;
    width: 37px; height: 33px;          /* 30 px of pin + the margin (viewBox 80 x 72) */
    transform-origin: 0 0;
  }
  .ev svg { display: block; width: 100%; height: 100%; overflow: visible;
            filter: drop-shadow(0 0 3px rgba(0, 0, 0, 0.55)); }
  /* The GPS route, in TRACKMAP pixels (viewBox 512). On a layer of its own,
     just above the ground (translateZ, set by place()): so hiding the part
     already driven does not force the whole map to be rasterized again. */
  .routelayer { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
  .route { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .route path { fill: none; stroke-linejoin: round; stroke-linecap: round; }
  .route-edge { stroke: rgba(0, 0, 0, 0.55); stroke-width: 2.6; }
  .route-line { stroke: #00e5ff; stroke-width: 1.5; }
  .ev .disc { fill: var(--c); }
  /* The pin's tip (bottom centre) sits on the rim and points at the target; the
     pin turns around it, and the icon turns back to stay upright. */
  .edge {
    position: absolute; left: 50%; top: 50%;
    width: 28px; height: 25px;          /* 22 px of pin + the margin (viewBox 80 x 72) */
    margin: -25px 0 0 -14px;            /* the tip, bottom centre, on the point */
    transform-origin: 50% 100%;
    filter: drop-shadow(0 0 3px rgba(0, 0, 0, 0.55));
    will-change: transform, opacity;
    opacity: 0;
    transition: opacity 0.25s linear;   /* target changes without a jump */
  }
  /* native style: the circles are not in the 3D (half would sink into the
     ground, and resting them on their base left them above the point). They
     live on this 2D layer, each centred on the projected point, and fade at the
     border like the gradient. */
  .flat { position: absolute; inset: 0; pointer-events: none; }
  .flat .ev { left: 50%; top: 50%; width: 30px; height: 30px; margin: -15px 0 0 -15px; }
  /* native style: a circle instead of the pin, centred on the point (no tip) */
  /* native: the circle (square viewBox, centred) with its centre on the point */
  .edge.native { width: 28px; height: 28px; margin: -14px 0 0 -14px; transform-origin: 50% 50%; }
  /* The outline of every icon is the X's: the same dark, 4 units outside the
     colour (a stroke 8 wider underneath, or paint-order: stroke). */
  .ev .ringedge, .edge .ringedge { fill: none; stroke: rgba(6, 10, 12, 0.7); stroke-width: 19; }
  .ev .ring, .edge .ring { fill: rgba(0, 0, 0, 0.35); stroke: var(--c); stroke-width: 11; }
  .ev .dot, .edge .dot { fill: var(--c); stroke: rgba(6, 10, 12, 0.7); stroke-width: 8; paint-order: stroke; }
  .ev .body, .edge .body { stroke: rgba(6, 10, 12, 0.7); stroke-width: 8; paint-order: stroke; stroke-linejoin: round; }
  .car svg path, .rival svg path { stroke: rgba(6, 10, 12, 0.7); stroke-width: 8; paint-order: stroke; stroke-linejoin: round; }
  .ev .xedge, .edge .xedge { stroke: rgba(6, 10, 12, 0.7); stroke-width: 20; stroke-linecap: round; }
  .ev .xmark, .edge .xmark { stroke: var(--c); stroke-width: 12; stroke-linecap: round; }
  .edge .iconwrap { transform-box: fill-box; transform-origin: center; transform: rotate(var(--ir, 0deg)); }
  .edge svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .edge .disc { fill: var(--c); }
  .edge .icon, .edge .icon path { fill: #fff; }
  /* The rivals: the same arrow, lying on the ground and turned by each one's
     heading. */
  .rival {
    position: absolute; left: 0; top: 0;
    width: 20px; height: 20px;
    transform-origin: 0 0;
    filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.45));
  }
  .rival svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .rival svg path { fill: #f39c12; }
  .car svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .car svg path { fill: #2ecc71; }   /* the player's colour */
  /* in the native style, the game's: PlayerCarIndicator_1 and AIRACERINDICATOR_ */
  .mm.native .car svg path { fill: #30cf30; }
  .mm.native .rival svg path { fill: #cf8030; }
  .ev .icon { fill: #fff; }
  .ev .icon path { fill: #fff; }

  /* The player: icons/PLAYER.svg, inlined by the script to take the colour. */
  .car {
    position: absolute;
    left: 50%; top: 64%;
    width: 24px; height: 24px;
    margin: -12px 0 0 -12px;
    filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.45));   /* soft shadow, same as the pins' */
  }

  .north {
    position: absolute;
    left: 50%; top: 50%;
    width: 26px; height: 13px;
    margin: -6px 0 0 -13px;
    background: url(http://nfsu2.tex/MINIMAP_NORTH_INDICATOR) 0 0 / 100% 100%;
    will-change: transform;
  }

  /* ---- the expanded map (the M) ----
     Full screen over the game's map, which main.js leaves open underneath
     (it is what pauses the game). Top-down, north up; drag, wheel, keyboard.
     The world is a 2048 px layer (the 512 map x 4) moved and scaled by
     transform, with the markers inside it unscaled so they keep the same
     size at any zoom. */
  .big {
    position: absolute; inset: 0;
    display: none;
    background: rgba(0, 0, 0, 0.55);   /* the game behind, darkened */
    pointer-events: auto;
    font: 13px "Segoe UI", Arial, sans-serif;
    color: #dfe6e9;
  }
  .big.on { display: block; }
  .bigwrap { position: absolute; inset: 5% 6%; --nfs-size: 15px; }
  .bigpanel { width: 100%; height: 100%; display: flex; flex-direction: column; }
  .bigbody { flex: 1; min-height: 0; display: flex; }
  .bigsplit { flex: 1; min-height: 0; }
  .bigside { width: 260px; flex: none; overflow: hidden; }
  .bigview {
    position: relative; overflow: hidden; padding: 0 !important;
    background: #0d1417;
    cursor: grab;
  }
  .bigview.drag { cursor: grabbing; }
  .bigworld {
    position: absolute; left: 0; top: 0;
    width: 2048px; height: 2048px;
    transform-origin: 0 0;
    will-change: transform;
  }
  .bigimg { position: absolute; inset: 0; background: 0 0 / 100% 100% no-repeat; }
  .bigroute { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .bigroute path { fill: none; stroke-linejoin: round; stroke-linecap: round; }
  .bigroute .route-edge { stroke: rgba(0, 0, 0, 0.55); stroke-width: 2.6; }
  .bigroute .route-line { stroke: #00e5ff; stroke-width: 1.5; }
  .bigpin {
    position: absolute; left: 0; top: 0;
    width: 30px; height: 27px;          /* the pin, with the viewBox 80 x 72 margin */
    margin: -27px 0 0 -15px;            /* the tip on the point */
    transform-origin: 50% 100%;
    cursor: pointer;
  }
  .bigpin.native { width: 26px; height: 26px; margin: -13px 0 0 -13px; transform-origin: 50% 50%; }
  .bigpin svg { display: block; width: 100%; height: 100%; overflow: visible;
                filter: drop-shadow(0 0 3px rgba(0, 0, 0, 0.55)); }
  .bigpin .disc { fill: var(--c); }
  .bigpin .icon, .bigpin .icon path { fill: #fff; }
  .bigpin .body { stroke: rgba(6, 10, 12, 0.7); stroke-width: 8; paint-order: stroke; stroke-linejoin: round; }
  .bigpin .ringedge { fill: none; stroke: rgba(6, 10, 12, 0.7); stroke-width: 19; }
  .bigpin .ring { fill: rgba(0, 0, 0, 0.35); stroke: var(--c); stroke-width: 11; }
  .bigpin .dot { fill: var(--c); stroke: rgba(6, 10, 12, 0.7); stroke-width: 8; paint-order: stroke; }
  .bigpin .xedge { stroke: rgba(6, 10, 12, 0.7); stroke-width: 20; stroke-linecap: round; }
  .bigpin .xmark { stroke: var(--c); stroke-width: 12; stroke-linecap: round; }
  .bigarrow {
    position: absolute; left: 0; top: 0;
    width: 26px; height: 26px; margin: -13px 0 0 -13px;
    transform-origin: 50% 50%;
    filter: drop-shadow(0 0 3px rgba(0, 0, 0, 0.6));
    pointer-events: none;
  }
  .bigarrow svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .bigarrow svg path { stroke: rgba(6, 10, 12, 0.7); stroke-width: 8; paint-order: stroke; stroke-linejoin: round; }
  .bigarrow.me svg path { fill: #2ecc71; }
  .bigarrow.rival svg path { fill: #f39c12; }
  .big.native .bigarrow.me svg path { fill: #30cf30; }
  .big.native .bigarrow.rival svg path { fill: #cf8030; }
  .bigarrow.rival { width: 20px; height: 20px; margin: -10px 0 0 -10px; }

  #legend .sw { width: 1.3em; height: 1.3em; flex: none; margin-right: 0.5em; }
  #legend .sw svg { width: 100%; height: 100%; overflow: visible; }
  #legend .sw .disc { fill: var(--c); }
  #legend .sw .icon, #legend .sw .icon path { fill: #fff; }
  #legend .sw .ring { fill: rgba(0, 0, 0, 0.35); stroke: var(--c); stroke-width: 11; }
  #legend .sw .ringedge { fill: none; stroke: rgba(6, 10, 12, 0.7); stroke-width: 19; }
  #legend .sw .dot { fill: var(--c); stroke: rgba(6, 10, 12, 0.7); stroke-width: 8; paint-order: stroke; }
  #legend .sw .body { stroke: rgba(6, 10, 12, 0.7); stroke-width: 8; paint-order: stroke; }
  #legend .sw .xedge { stroke: rgba(6, 10, 12, 0.7); stroke-width: 20; stroke-linecap: round; }
  #legend .sw .xmark { stroke: var(--c); stroke-width: 12; stroke-linecap: round; }
  #legend .sw.arrow svg path { stroke: rgba(6, 10, 12, 0.7); stroke-width: 8; paint-order: stroke; }
  #legend .nfs-row.off { opacity: 0.28; }
  /* zoom in, zoom out, recentre: bottom right */
  .bigctl {
    position: absolute; right: 14px; bottom: 12px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .bigctl .nfs-btn-round { width: 2.5em; height: 2.5em; font-size: 15px; }
  .bigctl svg { width: 1.15em; height: 1.15em; display: block; }
  .bigctl svg path, .bigctl svg circle { fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; }
  .bigtip {
    position: absolute; left: 0; top: 0;
    padding: 5px 9px;
    background: rgba(8, 14, 17, 0.92);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 5px;
    font-size: 12px; white-space: nowrap;
    pointer-events: none;
    display: none;
  }
</style>

<div class="mm" id="mm">
  <div class="view">
    <div class="plane" id="plane">
      <div class="routelayer" id="routelayer">
        <svg class="route" viewBox="0 0 512 512"><path class="route-edge"/><path class="route-line"/></svg>
      </div>
      <div class="ground">
        <div class="bitmap"></div>
      </div>
    </div>
  </div>
  <div class="flat" id="flat"></div>
  <div class="car"></div>
  <div class="north" id="north"></div>
</div>

<div class="big" id="big">
  <div class="nfs bigwrap">
    <div class="nfs-panel bigpanel">
      <div class="nfs-panel__head">
        <h1 class="nfs-title">Map</h1>
        <div class="nfs-subtitle" style="flex:1">Full map</div>
      </div>
      <div class="nfs-panel__body bigbody">
        <div class="nfs-split bigsplit">
          <div class="nfs-split__side bigside">
            <ul class="nfs-list" id="legend"></ul>
          </div>
          <div class="nfs-split__main bigview" id="bigview">
            <div class="bigworld" id="bigworld">
              <div class="bigimg"></div>
              <svg class="bigroute" viewBox="0 0 512 512"><path class="route-edge"/><path class="route-line"/></svg>
              <div id="bigpins"></div>
            </div>
            <div class="bigctl">
              <button class="nfs-btn-round" id="bigzin" title="Zoom in (+)"><svg viewBox="0 0 20 20"><path d="M10 4v12M4 10h12"/></svg></button>
              <button class="nfs-btn-round" id="bigzout" title="Zoom out (-)"><svg viewBox="0 0 20 20"><path d="M4 10h12"/></svg></button>
              <button class="nfs-btn-round" id="bigrecenter" title="Recentre (C)"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="5"/><path d="M10 1.5v4M10 14.5v4M1.5 10h4M14.5 10h4"/></svg></button>
            </div>
            <div class="bigtip" id="bigtip"></div>
          </div>
        </div>
      </div>
      <div class="nfs-panel__foot">
        <button class="nfs-btn" id="bigback">Back</button>
        <button class="nfs-btn" id="bigcenter">Centre</button>
      </div>
    </div>
  </div>
</div>

<script>
  const TILT = 58;    // degrees the plane is tilted
  // Zoom: screen pixels per TRACKMAP pixel (512), before the perspective,
  // times the track's TrackInfo radar factor (1.5 in the city, 2 in drag, 1
  // in drift and Street X). In the city that gives 4.6, the zoom set by eye;
  // closed tracks, small on the map, come proportionally closer.
  const MAP_PX = 6.0 / 1.5;
  // Dynamic zoom (main.js sends p.kmh when it is on): up to ZOOM_FROM km/h the
  // zoom is the one above; from there to ZOOM_TO it opens to ZOOM_OUT of it, and
  // no further (the widest it goes). Eased, so it does not breathe on shifts.
  // (40 to 220 km/h was too wide: at 100 km/h it opened only 15%, unnoticeable.)
  const ZOOM_FROM = 30, ZOOM_TO = 150, ZOOM_OUT = 0.5, ZOOM_EASE = 0.05;
  let zoomNow = 1;
  // The turn is eased too: the camera heading arrives by message, at
  // irregular intervals, and the game's camera jolts; on each pose it moves
  // TURN_EASE of the way to the new value, the short way round the circle.
  const TURN_EASE = 0.3;
  let turnNow = null;
  // .ground is 512 * Q layout pixels: resolution to spare for the near part,
  // enlarged by the perspective
  const Q = 6;
  const FREE_ROAM = 4000;   // the only map where the race starts show

  // the mod's palette; URL and SUV still with the UI_InGame_WorldMap.fng colours
  const KIND_COLOUR = {
    CIRCUIT: '#9b59b6', DRAG: '#2980b9', STREET: '#3498db', DRIFT: '#f1c40f',
    SPRINT: '#2ecc71', URL: '#beb42d', SUV: '#cf8030'
  };
  const SHOP_COLOUR = {
    PAINT: '#c0392b', BODY: '#16a085', PERFORMANCE: '#2980b9',
    CARLOT: '#3498db', SPECIALTY: '#f39c12', GARAGE: '#8e44ad'
  };
  // In the native style, the game's own colours: those of each <PREFIX>1 in
  // HUD_SingleRace.fng (the same as the pause map's).
  const NATIVE_COLOUR = {
    CIRCUIT: '#a53ce9', DRAG: '#3282c8', STREET: '#82bee6', DRIFT: '#caf48a',
    SPRINT: '#0e9c0e', URL: '#beb42d', SUV: '#cf8030',
    PAINT: '#72101d', BODY: '#107010', PERFORMANCE: '#2b64a4', CARLOT: '#52a3a3',
    SPECIALTY: '#808000', GARAGE: '#5b027d'
  };
  const WAYPOINT_COLOUR = '#d63fd6';   // the player's own marker, in both styles
  const colourOf = (kind) => kind === 'WAYPOINT' ? WAYPOINT_COLOUR :
    (iconStyle === 'native' ? NATIVE_COLOUR[kind] : KIND_COLOUR[kind] || SHOP_COLOUR[kind]) || '#ffffff';
  // the icon inside the circle (icons/, Font Awesome Free). Mega Low and the
  // Uniques have no icon yet and are left out.
  const ICON = {
    RACE: 'flag-checkered-solid-full.svg',
    SPECIAL: 'xmark.svg',                 // the special events, the map's X (provisional)
    PAINT: 'spray-can-solid-full.svg', BODY: 'star-solid-full.svg',
    PERFORMANCE: 'wrench-solid-full.svg', CARLOT: 'car-solid-full.svg',
    SPECIALTY: 'volume-solid-full.svg', GARAGE: 'house-solid-full.svg',
    WAYPOINT: 'waypoint.svg'              // the player's own marker
  };

  const mm = root.getElementById('mm');
  const plane = root.getElementById('plane');
  const north = root.getElementById('north');
  const carEl = root.querySelector('.car');
  const flat = root.getElementById('flat');
  const bitmap = root.querySelector('.bitmap');
  let arrowSvg = '';
  fetch(new URL('icons/PLAYER.svg', mod.url)).then((r) => r.ok ? r.text() : '')
    .then((t) => { arrowSvg = t; root.querySelector('.car').innerHTML = t; }).catch(() => {});

  // One element per rival, reused from frame to frame.
  const rivals = [];
  function placeRivals(list, s, r) {
    while (rivals.length < list.length) {
      const el = document.createElement('div');
      el.className = 'rival';
      el.innerHTML = arrowSvg;
      plane.appendChild(el);
      rivals.push(el);
    }
    for (let i = 0; i < rivals.length; i++) {
      const el = rivals[i];
      if (i >= list.length) { el.style.display = 'none'; continue; }
      if (!el.firstChild && arrowSvg) el.innerHTML = arrowSvg;
      const c = list[i];
      const { gx, gy } = toGround(c.x, c.y);
      // lying on the ground, a little above it (translateZ) so it does not
      // fight the map over depth; the same size on screen at any zoom; the
      // arrow's tip along the heading: h in the world becomes 90 - h degrees on the map
      el.style.display = '';
      el.style.transform = 'translate(' + gx + 'px,' + gy + 'px) translateZ(' + (2 / s) + 'px) ' +
        'scale(' + (1 / s) + ') rotate(' + (90 - c.h * 180 / Math.PI) + 'deg) translate(-50%,-50%)';
    }
  }

  // One pin template per icon: icons/PIN.svg with the white icon placed inside
  // its <circle> or <ellipse>, whose centre and radius are read from the file
  // itself. Each marker gets a copy of its template; the circle takes the
  // colour from the --c variable.
  const pins = {};
  async function loadPins() {
    const text = async (f) => { const r = await fetch(new URL('icons/' + f, mod.url)); return r.ok ? r.text() : ''; };
    const parse = (t) => new DOMParser().parseFromString(t, 'image/svg+xml').documentElement;
    const pin = await text('PIN.svg');
    for (const [key, file] of Object.entries(ICON)) {
      const base = parse(pin);
      const icon = parse(await text(file));
      const disc = base.querySelector('circle, ellipse');
      const body = base.querySelector('path');      // the pin's white body
      if (body) body.setAttribute('class', 'body');
      if (icon.nodeName === 'svg' && disc) {
        const num = (a) => parseFloat(disc.getAttribute(a)) || 0;
        const cx = num('cx'), cy = num('cy');
        const r = Math.min(num('r') || num('rx'), num('r') || num('ry'));
        const size = r * 1.4;   // the icon fills most of the circle
        disc.setAttribute('class', 'disc');
        icon.setAttribute('x', cx - size / 2);
        icon.setAttribute('y', cy - size / 2);
        icon.setAttribute('width', size);
        icon.setAttribute('height', size);
        icon.setAttribute('class', 'icon');
        // in a <g> of its own, so the edge marker can turn the icon back
        const wrap = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        wrap.setAttribute('class', 'iconwrap');
        wrap.appendChild(icon);
        base.appendChild(wrap);
      }
      // margin at the sides and top for the shadow; at the bottom the drawing
      // ends at the tip (y 64), which is where the pin rests
      base.setAttribute('viewBox', '-8 -8 80 72');
      pins[key] = base.outerHTML;
    }
  }
  // The markers stand in the same 3D space as the ground: anything below the
  // resting point would go through the ground and vanish (that was the "cut"
  // at the bottom). So the drawing ends at the rest, the shadow goes around
  // (not below), and they rise LIFT pixels off the ground.
  const LIFT = 4;
  const pinsReady = loadPins().catch((e) => console.log('minimap: could not load the map icons: ' + e.message));

  // 'native' style (main.js, 'style'): circles like the game's minimap ones -
  // filled for a shop, a thick-edged ring for an event, the special with an X.
  let iconStyle = 'pin';
  // same viewBox as the pins (-8 -8 80 72): the drawing ends at the bottom,
  // where it rests. The special is the game's X: just the X, in colour, with a dark outline.
  const NATIVE_RACE = '<svg viewBox="-8 -8 80 80"><circle class="ringedge" cx="32" cy="32" r="23"/>' +
    '<circle class="ring" cx="32" cy="32" r="23"/></svg>';
  const NATIVE_SPECIAL = '<svg viewBox="-8 -8 80 80"><path class="xedge" d="M14 14L50 50M50 14L14 50"/>' +
    '<path class="xmark" d="M14 14L50 50M50 14L14 50"/></svg>';
  const NATIVE_SHOP = '<svg viewBox="-8 -8 80 80"><circle class="dot" cx="32" cy="32" r="22"/></svg>';
  function markup(icon) {
    if (iconStyle !== 'native') return pins[icon] || '';
    return icon === 'RACE' ? NATIVE_RACE : icon === 'SPECIAL' ? NATIVE_SPECIAL : NATIVE_SHOP;
  }
  root.querySelector('.ground').style.width = root.querySelector('.ground').style.height = 512 * Q + 'px';
  const routeLayer = root.getElementById('routelayer');
  routeLayer.style.width = routeLayer.style.height = 512 * Q + 'px';

  let track = null;     // the loaded track's TrackInfo, from main.js
  let frame = null;     // the framing of the map in use: { ulx, uly, width }
  // Framings of the redrawn maps that do not follow the game's (the URL
  // circuit, for one, becomes an enlarged crop). Measured by
  // tools/minimap_calibrate.py against each race's route; they only apply to
  // the map shipped with the mod, never to the game's.
  let calibration = {};
  const calibrationReady = fetch(new URL('../maps/calibration.json', mod.url))
    .then((r) => r.ok ? r.json() : {})
    .then((c) => { calibration = c; })
    .catch(() => {});
  let starts = [];      // the free roam race starts, in world coordinates
  let shops = [];       // the shops, likewise
  // what the career shows now (main.js, 'career'): { triggers, zones } with
  // the hashes; null = no such information, and then everything shows
  let career = null;
  const events = [];    // { el, gx, gy }: position on .ground, in layout pixels

  // world -> .ground pixel, by the calibration of the track's TRACKMAP
  function toGround(x, y) {
    const k = 512 * Q / frame.width;
    return { gx: (x - frame.ulx) * k, gy: (frame.uly - y) * k };
  }

  // The category that appears most at the point decides the colour.
  function kindOf(ev) {
    const n = {};
    for (const r of ev.races) n[r.kind] = (n[r.kind] || 0) + 1;
    return Object.keys(n).sort((a, b) => n[b] - n[a])[0];
  }

  async function loadEvents() {
    const [ev, sh] = await Promise.all([
      fetch('http://nfsu2.data/L4RA/events.json').then((r) => r.ok ? r.json() : { events: [] }),
      fetch('http://nfsu2.data/L4RA/shops.json').then((r) => r.ok ? r.json() : { shops: [] })
    ]);
    starts = ev.events;
    shops = sh.shops.filter((x) => ICON[x.kind]);
    await pinsReady;
    placeEvents();
  }

  const KIND_NAME = { CIRCUIT: 'Circuit', DRAG: 'Drag', STREET: 'Street X', DRIFT: 'Drift', SPRINT: 'Sprint',
    URL: 'URL', SUV: 'SUV', PAINT: 'Paint', BODY: 'Body', PERFORMANCE: 'Performance',
    CARLOT: 'Car Lot', SPECIALTY: 'Specialty', GARAGE: 'Garage' };
  function addPin(x, y, colour, icon, title, cat, kind, label) {
    const el = document.createElement('div');
    el.className = 'ev';
    el.innerHTML = markup(icon);
    el.style.setProperty('--c', colour);
    el.title = title;
    const isFlat = iconStyle === 'native';
    (isFlat ? flat : plane).appendChild(el);
    const { gx, gy } = toGround(x, y);
    events.push({ el, gx, gy, wx: x, wy: y, colour, icon, cat, flat: isFlat, kind, label: label || title });
  }

  // With a GPS route, only its destination stays: the pin nearest the target
  // (within FOCUS_NEAR), on the map and on the border, and on the border
  // without fading by distance. With no route, everything comes back.
  // a shop's GPS target is a point on the street, 13-115 units from it
  const FOCUS_NEAR = 150;  // world units
  // On arrival (near the target, or with the whole route driven) the filter
  // goes; it only comes back with a new GPS route.
  const ARRIVE = 40;       // world units
  let focus = null, arrived = false;
  // The player's own marker: { x, y } where it was put, { tx, ty } the street
  // point the GPS was sent to, and whether a route to it has arrived. It goes
  // when the car gets there, or when the GPS is sent somewhere else.
  let waypoint = null;
  const WAYPOINT_NEAR = 40;   // world units between the route's target and the marker's street point
  const toWaypoint = (t) => waypoint && t && Math.hypot(t.x - waypoint.tx, t.y - waypoint.ty) < WAYPOINT_NEAR;
  const routing = () => route && !arrived;
  function applyFocus() {
    focus = null;
    if (routing() && waypoint && toWaypoint(route.target)) focus = events.find((e) => e.kind === 'WAYPOINT') || null;
    else if (routing() && route.target) {
      let bd = FOCUS_NEAR * FOCUS_NEAR;
      for (const e of events) {
        const d = (e.wx - route.target.x) ** 2 + (e.wy - route.target.y) ** 2;
        if (d < bd) { bd = d; focus = e; }
      }
    }
    for (const e of events) e.el.style.display = routing() && e !== focus ? 'none' : '';
  }
  function checkArrival(p) {
    if (!route || arrived) return;
    const t = route.target;
    const near = t && (p.x - t.x) ** 2 + (p.y - t.y) ** 2 < ARRIVE * ARRIVE;
    // a marker is reached only by getting to it: a short route rebuilt from
    // the street next to the car could look walked through at once
    const done = !(waypoint && toWaypoint(t)) && routeWorld.length > 4 && routeAt >= routeWorld.length / 2 - 2;
    if (near || done) {
      arrived = true;
      if (waypoint && toWaypoint(t)) {
        waypoint = null; placeEvents();
      }
      applyFocus();
    }
  }

  // On the border, as in the game's minimap: the nearest of each category
  // (race or shop kind) that is out of view shows pinned to the radar's rim,
  // in its direction. Outside the 3D, in .mm.
  const edges = {};   // category -> element
  const EDGE_RADIUS = 1.12;  // in radar radii: the tip sits beyond the fade
  // opacity by the target's distance, in radar radii: opaque just out of
  // view, EDGE_FAINT from EDGE_FAR radii on
  const EDGE_FAR = 6, EDGE_FAINT = 0.25;
  // the fade-in: in radar radii, of the projected point. At EDGE_IN the target
  // has just left the view and the edge pin is still transparent; at
  // EDGE_FULL it is opaque. Without this it appeared all at once ("pop").
  const EDGE_IN = 0.8, EDGE_FULL = 1.4;
  function edgeFor(e) {
    let el = edges[e.cat];
    if (!el) {
      el = edges[e.cat] = document.createElement('div');
      el.className = 'edge';
      mm.appendChild(el);
    }
    const want = iconStyle + ':' + e.icon;
    if (el.dataset.icon !== want) {
      el.innerHTML = markup(e.icon);
      el.dataset.icon = want;
      el.classList.toggle('native', iconStyle === 'native');
    }
    el.style.setProperty('--c', e.colour);
    return el;
  }
  // Where a ground point lands on screen, by the same maths CSS does: the plane
  // turns rotateX(TILT) around the car's point (50%, 64% of the view) and the
  // view projects with perspective PERSPECTIVE from 50%, 40%. (sx, sy) is the
  // point on the plane, in px, already turned by the heading; returns { x, y }
  // relative to the view's centre, or null if it falls behind the camera.
  const PERSPECTIVE = 420, CAR_AT = 0.64, EYE_AT = 0.40;
  function project(sx, sy) {
    const W = mm.clientWidth, H = mm.clientHeight;
    const t = TILT * Math.PI / 180;
    const y = sy * Math.cos(t), z = sy * Math.sin(t);
    if (z <= -PERSPECTIVE * 0.95) return null;
    const f = PERSPECTIVE / (PERSPECTIVE - z);
    const X = (sx) * f;                                  // horizontal: origin at the centre
    const Y = (H * CAR_AT + y - H * EYE_AT) * f + H * EYE_AT;
    return { x: X, y: Y - H / 2, f };
  }

  // The radar's outline. Round: a point's "out" is its distance over the
  // radius. Rectangular: the larger of |x| and |y| over the half width and the
  // half height, 1 on the border. rim(vx, vy, at) scales a direction to reach
  // the outline times `at`.
  const isRect = () => mm.classList.contains('rect');
  function outOf(x, y) {
    const hw = mm.clientWidth / 2, hh = mm.clientHeight / 2;
    return isRect() ? Math.max(Math.abs(x) / hw, Math.abs(y) / hh) : Math.hypot(x, y) / hw;
  }
  function rim(vx, vy, at) {
    const o = outOf(vx, vy) || 1;
    return at / o;
  }
  // With a solid edge there is no fade: an edge pin shows as soon as its
  // target leaves the frame, and sits just inside the border.
  const isSolid = () => mm.classList.contains('solid');
  const EDGE_SOLID_AT = 0.93, EDGE_SOLID_IN = 0.97, EDGE_SOLID_FULL = 1.15;

  function placeEdges(gx, gy, s, r) {
    const R = Math.min(mm.clientWidth, mm.clientHeight) / 2;
    const solid = isSolid();
    const edgeIn = solid ? EDGE_SOLID_IN : EDGE_IN, edgeFull = solid ? EDGE_SOLID_FULL : EDGE_FULL;
    const cr = Math.cos(r * Math.PI / 180), sr = Math.sin(r * Math.PI / 180);
    const best = {};
    for (const e of events) {
      if (routing() && e !== focus) continue;
      const dx = (e.gx - gx) * s, dy = (e.gy - gy) * s;
      const d = dx * dx + dy * dy;
      if (!best[e.cat] || d < best[e.cat].d) best[e.cat] = { e, d, fx: dx * cr - dy * sr, fy: dx * sr + dy * cr };
    }
    for (const cat of Object.keys(edges)) if (!best[cat]) edges[cat].style.opacity = 0;
    for (const cat of Object.keys(best)) {
      const b = best[cat];
      const pnt = project(b.fx, b.fy);
      // how far the target has left the view: 0 while the projected point is on
      // the map, 1 once it is well outside; behind the camera, fully out
      const out = pnt ? outOf(pnt.x, pnt.y) : edgeFull;
      const appear = Math.min(1, Math.max(0, (out - edgeIn) / (edgeFull - edgeIn)));
      if (appear <= 0) { if (edges[cat]) edges[cat].style.opacity = 0; continue; }
      // direction: the projected point's; behind the camera, the plane's
      const vx = pnt ? pnt.x : b.fx, vy = pnt ? pnt.y : b.fy;
      const dist = Math.hypot(vx, vy) || 1;
      b.sx = vx; b.sy = vy;
      const el = edgeFor(b.e);
      const k = rim(vx, vy, solid ? EDGE_SOLID_AT : EDGE_RADIUS);
      // the tip points outwards, towards the target: the "standing" pin points
      // down (90 degrees), so it turns by angle - 90
      const turn = iconStyle === 'native' ? 0 : Math.atan2(b.sy, b.sx) * 180 / Math.PI - 90;
      const far = Math.sqrt(b.d) / R;             // real distance, without the tilt
      const t = Math.min(1, Math.max(0, (far - 1) / (EDGE_FAR - 1)));
      el.style.opacity = routing() ? appear : appear * (1 - t * (1 - EDGE_FAINT));
      el.style.setProperty('--ir', (-turn) + 'deg');
      el.style.transform = 'translate(' + (b.sx * k) + 'px,' + (b.sy * k) + 'px) rotate(' + turn + 'deg)';
    }
  }

  // The pins only exist in free roam: in a race the starts mean nothing.
  // In the career, only what the pause map would show: available races,
  // the stage's shops already found, and honouring the legend's filters.
  function placeEvents() {
    for (const e of events) e.el.remove();
    events.length = 0;
    for (const cat of Object.keys(edges)) edges[cat].style.opacity = 0;
    if (!track || !frame || track.id !== FREE_ROAM) return;
    const zone = career ? new Set(career.zones) : null;
    if (career) {
      // One pin per race the pause map shows now (already filtered by the
      // legend, by the game itself). The kind is the available race's - found
      // by track among the trigger's -, and the special gets the X.
      const byHash = {};
      for (const ev of starts) byHash[ev.hash] = ev;
      // A special event is a race of one kind, and follows that kind's legend
      // filter: the game files specials under a category of their own, which
      // the legend does not show, so they would never hide.
      const RACE_CAT = { CIRCUIT: 0, DRAG: 1, STREET: 2, DRIFT: 3, SPRINT: 4, URL: 5, SUV: 6 };
      const off = career.off || [];
      const seen = new Set();
      for (const c of career.races) {
        const ev = byHash[c.trigger];
        if (!ev) continue;
        const r = ev.races.find((x) => x.track === c.track) || ev.races[0];
        const k = r.kind, icon = c.special ? 'SPECIAL' : 'RACE';
        if (c.special && off[RACE_CAT[k]]) continue;
        const key = c.trigger + ':' + k + ':' + icon;
        if (seen.has(key)) continue;
        seen.add(key);
        addPin(ev.x, ev.y, colourOf(k), icon, r.name || k,
               'race:' + (c.special ? 'SPECIAL' : k), k,
               (c.special ? 'Special - ' : '') + KIND_NAME[k]);
      }
    } else {
      for (const ev of starts) {
        const k = kindOf(ev);
        addPin(ev.x, ev.y, colourOf(k), 'RACE',
               ev.races.map((x) => x.name || x.kind).join(', '), 'race:' + k, k,
               KIND_NAME[k]);
      }
    }
    for (const sh of shops)
      if (!zone || zone.has(sh.zone))
        addPin(sh.x, sh.y, colourOf(sh.kind), sh.kind, sh.name, 'shop:' + sh.kind, sh.kind,
               KIND_NAME[sh.kind]);
    if (waypoint)
      addPin(waypoint.x, waypoint.y, colourOf('WAYPOINT'), 'WAYPOINT', 'Marker', 'waypoint', 'WAYPOINT', 'Marker');
    applyFocus();
    if (bigOn) buildBigMarkers();
  }

  // The track's map: the redrawn one shipped with the mod, if there is one for
  // it, else the game's. Neither replaces a game file.
  // The framing follows the map: the game's uses the TrackInfo, the mod's the
  // calibration.json when the track is in it.
  function pickMap(id) {
    const mine = 'http://nfsu2.tex/mod/' + mod.id + '/maps/TRACKMAP' + id + '.dds';
    const game = 'http://nfsu2.tex/TRACKMAP' + id;
    const use = (url, f) => {
      if (!track || track.id !== id) return;
      frame = f;
      bitmap.style.backgroundImage = 'url(' + url + ')';
      placeEvents();
      drawRoute();
    };
    const img = new Image();
    img.onload = () => calibrationReady.then(() => use(mine, calibration[id] || track));
    img.onerror = () => use(game, track);
    bitmap.style.backgroundImage = 'none';
    frame = null;
    img.src = mine;
  }

  // The heading comes in radians on the world plane: 0 = +x, pi/2 = +y (north).
  // On the map y is flipped, so the car's front points to -h on screen,
  // and turning the plane by h - 90 degrees puts the front up.
  function place(p) {
    const { gx, gy } = toGround(p.x, p.y);
    // The radar turns with the camera (p.cam, when main.js has it) or with the car.
    // Turning with the camera, the player's arrow turns by the difference between
    // the car's heading and the camera's: looking sideways, it points where the
    // car is going.
    const want = typeof p.cam === 'number' ? p.cam : p.h;
    if (turnNow === null) turnNow = want;
    else {
      let d = want - turnNow;
      d -= Math.round(d / (2 * Math.PI)) * 2 * Math.PI;   // the short way
      turnNow += d * TURN_EASE;
    }
    const turn = turnNow;
    const r = turn * 180 / Math.PI - 90;
    const carTurn = (turn - p.h) * 180 / Math.PI;
    const carRot = Math.abs(carTurn) < 0.05 ? '' : 'rotate(' + carTurn.toFixed(2) + 'deg)';
    if (carEl.style.transform !== carRot) carEl.style.transform = carRot;
    // screen pixels per .ground pixel
    const kmh = typeof p.kmh === 'number' ? p.kmh : 0;
    const t = Math.min(1, Math.max(0, (kmh - ZOOM_FROM) / (ZOOM_TO - ZOOM_FROM)));
    zoomNow += ((1 - t * (1 - ZOOM_OUT)) - zoomNow) * ZOOM_EASE;
    const s = MAP_PX * track.zoom * zoomNow / Q;
    plane.style.transform =
      'rotateX(' + TILT + 'deg) scale(' + s + ') rotate(' + r + 'deg) ' +
      'translate(' + (-gx) + 'px,' + (-gy) + 'px)';

    // Each event undoes the plane's turn, scale and tilt: it stands upright on
    // its point, the same size on screen at any zoom, facing the camera.
    // translate(-50%,-100%) puts the pin's base on the point.
    // the pin rests its tip on the point; the native circle, its centre
    const stand = 'scale(' + (1 / s) + ') rotate(' + (-r) + 'deg) rotateX(' + (-TILT) + 'deg) ' +
                  'translate(-50%,-100%)';
    const pinLift = 'translateZ(' + (LIFT / s).toFixed(3) + 'px) ';
    const solid = isSolid();
    const cr = Math.cos(r * Math.PI / 180), sr = Math.sin(r * Math.PI / 180);
    for (const e of events) {
      if (!e.flat) {
        e.el.style.transform = 'translate(' + e.gx + 'px,' + e.gy + 'px) ' + pinLift + stand;
        continue;
      }
      // native, in 2D: the projected point, the size by the perspective, and the
      // radar's same fade (opaque to 55% of the radius, gone by the border)
      const dx = (e.gx - gx) * s, dy = (e.gy - gy) * s;
      const q = project(dx * cr - dy * sr, dx * sr + dy * cr);
      const out = q ? outOf(q.x, q.y) : 2;
      if (out > 1.05) { if (e.el.style.display !== 'none') e.el.style.display = 'none'; continue; }
      if (e.el.style.display === 'none' && !(routing() && e !== focus)) e.el.style.display = '';
      // the radar's fade, or whole until a solid border
      e.el.style.opacity = solid ? (out > 1 ? 0 : 1) : Math.min(1, Math.max(0, (1 - out) / 0.45));
      e.el.style.transform = 'translate(' + q.x.toFixed(1) + 'px,' + q.y.toFixed(1) + 'px) scale(' + q.f.toFixed(3) + ')';
    }
    placeRivals(p.rivals || [], s, r);
    placeEdges(gx, gy, s, r);
    const lift = 'translateZ(' + (1.5 / s).toFixed(3) + 'px)';
    if (routeLayer.style.transform !== lift) routeLayer.style.transform = lift;
    trimRoute(p);
    checkArrival(p);

    // north runs along the rim: on screen it sits r degrees from "up"
    const a = (r - 90) * Math.PI / 180;
    // inside the fade, where it still reads, or just inside a solid border
    const nk = rim(Math.cos(a), Math.sin(a), isSolid() ? 0.86 : 0.84);
    north.style.transform =
      'translate(' + (Math.cos(a) * nk) + 'px,' + (Math.sin(a) * nk) + 'px) rotate(' + r + 'deg)';
  }

  loadEvents().catch((e) => console.log('minimap: could not load the race and shop list: ' + e.message));

  // ---- the GPS route ----
  // graph.json: node -> [street, point, street, point], the two streets it joins;
  // roads.json: street (id) -> points. The route (main.js, 'route') is a list of
  // nodes; see routePoints.
  let graph = null, streets = null, route = null, lastPose = null;
  const graphReady = Promise.all([
    fetch('http://nfsu2.data/L4RA/graph.json').then((r) => r.json()),
    fetch('http://nfsu2.data/L4RA/roads.json').then((r) => r.json())
  ]).then(([g, r]) => {
    graph = g.nodes;
    streets = {};
    for (const l of r.lines) streets[l.id] = l.p;
  }).catch((e) => console.log('minimap: could not load the GPS road graph: ' + e.message));

  function nearestPoint(p, x, y) {
    let best = 0, bd = Infinity;
    for (let i = 0; i < p.length; i += 2) {
      const d = (p[i] - x) ** 2 + (p[i + 1] - y) ** 2;
      if (d < bd) { bd = d; best = i / 2; }
    }
    return best;
  }

  // The street nearest a position, among all of them, as a "node" standing on it:
  // { a, pa, b, pb } with the same street and the same point on both sides.
  function onStreet(pos) {
    let best = null, bd = Infinity;
    for (const id in streets) {
      const p = streets[id];
      for (let i = 0; i < p.length; i += 2) {
        const d = (p[i] - pos.x) ** 2 + (p[i + 1] - pos.y) ** 2;
        if (d < bd) { bd = d; best = { street: +id, idx: i / 2 }; }
      }
    }
    return best ? { a: best.street, pa: best.idx, b: best.street, pb: best.idx } : null;
  }

  // The street point nearest the car, for main.js to start the game's GPS
  // search from when the car is off the streets (a car park, a lot): the
  // game starts from the car itself, finds no road near it and gives up.
  // { x, y, d, cx, cy }: the point, its distance, and where the car was.
  function streetNearCar() {
    if (!streets || !lastPose) return null;
    const n = onStreet(lastPose);
    const q = n && streets[n.a];
    if (!q) return null;
    const x = q[2 * n.pa], y = q[2 * n.pa + 1];
    return { x, y, street: n.a, idx: n.pa, d: Math.hypot(x - lastPose.x, y - lastPose.y), cx: lastPose.x, cy: lastPose.y };
  }
  let snapSent = null;
  setInterval(() => {
    if (!track || track.id !== FREE_ROAM) return;
    const sn = streetNearCar();
    if (!sn || (snapSent && Math.hypot(sn.cx - snapSent.cx, sn.cy - snapSent.cy) < 1)) return;
    snapSent = sn;
    frsmodloader.send('snap', sn);
  }, 500);

  // the street's points from i to j, in the order the car drives them
  function walk(out, p, i, j) {
    const step = j >= i ? 1 : -1;
    for (let k = i; ; k += step) {
      out.push(p[2 * k], p[2 * k + 1]);
      if (k === j) break;
    }
  }

  // A node joins two streets: { a, pa, b, pb }. Consecutive route nodes
  // share a street, and that is the one the car drives from one to the next. The
  // list's order is not assumed (the A* may hand it from destination to origin):
  // for each pair, the shared street is walked from one's point to the other's,
  // and the list is reversed if its end is nearer the car.
  const side = (n, street) => (n.a === street ? n.pa : n.b === street ? n.pb : -1);
  function common(u, v) {
    if (u.a === v.a || u.a === v.b) return u.a;
    if (u.b === v.a || u.b === v.b) return u.b;
    return null;
  }
  function pointOf(n) {
    const p = streets[n.a];
    return p ? { x: p[2 * n.pa], y: p[2 * n.pa + 1] } : null;
  }
  const dist2 = (p, q) => (p.x - q.x) ** 2 + (p.y - q.y) ** 2;

  // Street -> nodes on it, for the search between two nodes with no street in
  // common: the shortest path in the graph, each hop costing the distance
  // along the street (Dijkstra). The fewest hops, which was the first
  // version, made up detours the GPS would not take.
  const OUTLIER = 600;   // world units
  let byStreet = null;
  function along(street, i, j) {
    const p = streets[street];
    if (!p || i < 0 || j < 0) return Infinity;
    let a = Math.min(i, j), b = Math.max(i, j), L = 0;
    for (let k = a; k < b; k++) L += Math.hypot(p[2 * k + 2] - p[2 * k], p[2 * k + 3] - p[2 * k + 1]);
    return L;
  }
  function bridge(u, v) {
    if (!byStreet) {
      byStreet = {};
      graph.forEach(([a, , b], i) => {
        (byStreet[a] = byStreet[a] || []).push(i);
        (byStreet[b] = byStreet[b] || []).push(i);
      });
    }
    const node = (i) => { const [a, pa, b, pb] = graph[i]; return { a, pa, b, pb }; };
    // min priority queue, in an array (a few thousand nodes)
    const heap = [];
    const push = (c, k) => { heap.push([c, k]); let i = heap.length - 1;
      while (i > 0) { const q = (i - 1) >> 1; if (heap[q][0] <= heap[i][0]) break; [heap[q], heap[i]] = [heap[i], heap[q]]; i = q; } };
    const pop = () => { const top = heap[0], last = heap.pop();
      if (heap.length) { heap[0] = last; let i = 0;
        for (;;) { const l = 2 * i + 1, r = l + 1; let m = i;
          if (l < heap.length && heap[l][0] < heap[m][0]) m = l;
          if (r < heap.length && heap[r][0] < heap[m][0]) m = r;
          if (m === i) break; [heap[m], heap[i]] = [heap[i], heap[m]]; i = m; } }
      return top; };
    const nodes = new Map([['u', u], ['v', v]]);
    const cost = new Map([['u', 0]]), prev = new Map();
    push(0, 'u');
    const limit = 4 * Math.sqrt(dist2(pointOf(u), pointOf(v))) + 400;
    while (heap.length) {
      const [c, k] = pop();
      if (c > cost.get(k)) continue;
      if (k === 'v') {
        const chain = [];
        for (let x = 'v'; x !== undefined; x = prev.get(x)) chain.unshift(nodes.get(x));
        return chain;
      }
      if (c > limit) break;
      const f = nodes.get(k);
      for (const st of [f.a, f.b]) {
        const from = side(f, st);
        const relax = (key, n) => {
          const cc = c + along(st, from, side(n, st));
          if (cc < (cost.has(key) ? cost.get(key) : Infinity)) {
            cost.set(key, cc); prev.set(key, k); nodes.set(key, n); push(cc, key);
          }
        };
        if (st === v.a || st === v.b) relax('v', v);
        for (const i of byStreet[st] || []) {
          const key = 'n' + i;
          if (key === k) continue;
          relax(key, nodes.get(key) || node(i));
        }
      }
    }
    return null;
  }

  function routePoints(r, from) {
    const out = [];
    // the nodes come ready from main.js, read from the game's memory; only the
    // ones on known streets count
    let nodes = r.nodes.filter((n) => streets[n.a] && streets[n.b]);
    // Entries far from both neighbours are not hops of the trip
    // (in a real route, 1689 and 1660 were thousands of units from the rest):
    // they are left out, and the gap they leave is filled by the graph.
    nodes = nodes.filter((n, i, all) => {
      const p = pointOf(n);
      if (!p) return false;
      const near = (m) => { const q = m && pointOf(m); return q && dist2(p, q) < OUTLIER * OUTLIER; };
      return all.length < 3 || near(all[i - 1]) || near(all[i + 1]);
    });
    if (!nodes.length) return out;
    if (from && nodes.length > 1) {
      const f = pointOf(nodes[0]), l = pointOf(nodes[nodes.length - 1]);
      if (f && l && dist2(l, from) < dist2(f, from)) nodes = nodes.reverse();
    }

    // The ends do not depend on the list: the car and the destination become
    // "nodes" on the street nearest each (among all), and the shortest path
    // joins them to the first and last node. The start used to be guessed from
    // the first node's streets, and when the car was not on one of them the
    // line started on the street next to it.
    const startNode = from ? onStreet(from) : null;
    const endNode = r.target ? onStreet(r.target) : null;
    const seq = [];
    if (startNode) seq.push(startNode);
    for (const n of nodes) seq.push(n);
    if (endNode) seq.push(endNode);

    // node to node, along the street the two share; when there is none, the
    // route skipped hops, and the path between them comes from the graph itself
    for (let i = 0; i + 1 < seq.length; i++) {
      const u = seq[i], v = seq[i + 1];
      const chain = common(u, v) !== null ? [u, v] : bridge(u, v) || [u, v];
      for (let k = 0; k + 1 < chain.length; k++) {
        const x = chain[k], y = chain[k + 1];
        const st = common(x, y);
        const p = st !== null ? streets[st] : null;
        if (p) walk(out, p, side(x, st), side(y, st));
        else { const q = pointOf(y); if (q) out.push(q.x, q.y); }
      }
    }
    return out;
  }

  // Some route nodes lie off the real path (a side street, the avenue's other
  // carriageway): the line went to them and came back - a dead-end branch, or
  // a double line. A GPS path does not pass the same place twice, so whenever
  // the line comes back within LOOP_GAP of a point it has already been, the
  // detour between the two is cut.
  const LOOP_GAP = 20;       // world units
  const LOOP_MIN = 3;        // points: immediate neighbours do not count as a loop
  function dropExcursions(pts) {
    const out = [];
    for (let i = 0; i < pts.length; i += 2) {
      const x = pts[i], y = pts[i + 1];
      // the oldest point already drawn that this one meets again
      let hit = -1;
      for (let k = 0; k + 2 * LOOP_MIN < out.length; k += 2)
        if ((out[k] - x) ** 2 + (out[k + 1] - y) ** 2 < LOOP_GAP * LOOP_GAP) { hit = k; break; }
      if (hit >= 0) out.length = hit + 2;   // the old point stays, the detour goes
      out.push(x, y);
    }
    return out;
  }

  function drawRoute() {
    const line = root.querySelector('.route-line'), edge = root.querySelector('.route-edge');
    if (!route || !graph || !frame || !track || track.id !== FREE_ROAM) {
      line.setAttribute('d', ''); edge.setAttribute('d', '');
      routeWorld = []; routeAlong = []; routeTotal = 0; routeAt = 0;
      if (bigOn) copyRoute();          // the expanded map drops it too
      return;
    }
    const pts = dropExcursions(routePoints(route, lastPose));
    let d = '', L = 0, lx = 0, ly = 0;
    routeWorld = pts;
    routeAlong = [];
    for (let i = 0; i < pts.length; i += 2) {
      const px = (pts[i] - frame.ulx) / frame.width * 512, py = (frame.uly - pts[i + 1]) / frame.width * 512;
      if (i) L += Math.hypot(px - lx, py - ly);
      routeAlong.push(L);
      lx = px; ly = py;
      d += (i ? 'L' : 'M') + px.toFixed(2) + ' ' + py.toFixed(2);
    }
    routeTotal = L;
    routeAt = 0;
    routeCut = -1;
    line.setAttribute('d', d); edge.setAttribute('d', d);
    applyCut(0);
  }

  // ---- the part already driven goes ----
  // The car is projected onto the route (the nearest vertex, searched from the
  // last one); what is behind is hidden by stroke-dasharray, which is only
  // changed when the cut moves ROUTE_STEP map pixels. Away from the route
  // (left it, the GPS will recalculate) nothing is hidden.
  let routeWorld = [], routeAlong = [], routeTotal = 0, routeAt = 0, routeCut = -1;
  const ROUTE_STEP = 0.5;       // TRACKMAP pixels
  const ROUTE_NEAR = 60;        // world units: farther than this, off the route
  const ROUTE_LOOK = 40;        // vertices ahead searched on each pose
  function applyCut(cut) {
    const line = root.querySelector('.route-line'), edge = root.querySelector('.route-edge');
    // a dash as long as the route followed by a gap of the same length, pulled
    // back by the cut: the start falls in the gap. (A zero-length dash, the
    // obvious way, leaves a dot from the round cap.)
    const T = (routeTotal + 1).toFixed(2);
    const dash = cut > 0 ? T + ' ' + T : 'none', off = cut > 0 ? (-cut).toFixed(2) : '0';
    for (const el of [line, edge]) { el.style.strokeDasharray = dash; el.style.strokeDashoffset = off; }
    routeCut = cut;
    if (bigOn) copyRoute();
  }
  function trimRoute(p) {
    const n = routeWorld.length / 2;
    if (!n) return;
    let best = -1, bd = ROUTE_NEAR * ROUTE_NEAR;
    const from = Math.max(0, routeAt - 4), to = Math.min(n - 1, routeAt + ROUTE_LOOK);
    for (let i = from; i <= to; i++) {
      const d = (routeWorld[2 * i] - p.x) ** 2 + (routeWorld[2 * i + 1] - p.y) ** 2;
      if (d < bd) { bd = d; best = i; }
    }
    if (best < 0) return;                 // off the route: leave it as is
    routeAt = best;
    const cut = routeAlong[best];
    if (Math.abs(cut - routeCut) >= ROUTE_STEP) applyCut(cut);
  }

  frsmodloader.on('route', (r) => {
    route = r; arrived = false;
    if (waypoint) {
      // A null route is the search being redone (off the route, off the
      // streets): the marker stays. Only a route to somewhere else takes it.
      if (r && toWaypoint(r.target) && !waypoint.routed) {
        waypoint.routed = true;
        frsmodloader.send('waypoint-routed');
      }
      else if (r && r.target && waypoint.routed) {
        waypoint = null; placeEvents();
      }
    }
    applyFocus();
    graphReady.then(drawRoute);
  });

  frsmodloader.on('track', (t) => {
    const changed = !track || track.id !== t.id;
    track = t;
    if (changed) pickMap(t.id);
    placeEvents();
  });
  frsmodloader.on('pose', (p) => {
    lastPose = p;
    if (!track || !frame) return;
    mm.classList.add('on');
    place(p);
  });
  frsmodloader.on('hide', () => { mm.classList.remove('on'); turnNow = null; });
  frsmodloader.on('career', (c) => { career = c; placeEvents(); });
  frsmodloader.on('paused', (v) => mm.classList.toggle('paused', !!v));
  frsmodloader.on('shape', (v) => {
    mm.classList.toggle('rect', v === 'rectangular');
    if (lastPose && track && frame) place(lastPose);
  });
  frsmodloader.on('edge', (v) => {
    mm.classList.toggle('solid', v === 'solid');
    if (lastPose && track && frame) place(lastPose);
  });
  frsmodloader.on('style', (v) => {
    iconStyle = v === 'native' ? 'native' : 'pin';
    mm.classList.toggle('native', iconStyle === 'native');
    placeEvents();
  });



  // ---- the expanded map (the M) ----
  // main.js sends 'bigmap' true when the game's map opens (it pauses the game)
  // and the page gets keyboard and mouse; closing here (Esc, M) asks 'bigmap-close'.
  // Camera in TRACKMAP pixels (0..512) and zoom in screen pixels per map
  // pixel; the target is chased every frame (requestAnimationFrame), which
  // gives the drag its inertia and the zoom its smoothness.
  const big = root.getElementById('big');
  const bigView = root.getElementById('bigview');
  const bigWorld = root.getElementById('bigworld');
  const bigImg = root.querySelector('.bigimg');
  const bigPins = root.getElementById('bigpins');
  const bigTip = root.getElementById('bigtip');
  const legendEl = root.getElementById('legend');
  const bigLine = root.querySelector('.bigroute .route-line');
  const bigEdge = root.querySelector('.bigroute .route-edge');
  const WORLD = 2048 / 512;          // layer pixels per map pixel
  const Z_MAX = 14, CAM_EASE = 0.22, INERTIA = 0.9, WHEEL_STEP = 1.18, KEY_PAN = 9, KEY_ZOOM = 1.035;
  const LEGEND_RACES = [['CIRCUIT', 'Circuit', 0], ['DRAG', 'Drag', 1], ['STREET', 'Street X', 2],
    ['DRIFT', 'Drift', 3], ['SPRINT', 'Sprint', 4], ['URL', 'URL', 5], ['SUV', 'SUV', 6]];
  const LEGEND_SHOPS = [['PAINT', 'Paint', 7], ['BODY', 'Body', 8], ['PERFORMANCE', 'Performance', 9],
    ['CARLOT', 'Car Lot', 10], ['SPECIALTY', 'Specialty', 11], ['GARAGE', 'Garage', 12]];
  let bigOn = false, bigRaf = 0, bigZoomShown = -1;
  const cam = { x: 256, y: 256, z: 2 }, tcam = { x: 256, y: 256, z: 2 }, vel = { x: 0, y: 0 };
  const keys = new Set();
  let dragging = null, bigMarkers = [], meEl = null, rivalEls = [];

  // Zoomed all the way out the image just fills the view, and the camera never
  // shows past its edges.
  const zMin = () => Math.max(bigView.clientWidth, bigView.clientHeight) / 512;
  function clampCam(c) {
    const hx = bigView.clientWidth / 2 / c.z, hy = bigView.clientHeight / 2 / c.z;
    const x = Math.min(512 - hx, Math.max(hx, c.x)), y = Math.min(512 - hy, Math.max(hy, c.y));
    const hit = { x: x !== c.x, y: y !== c.y };
    c.x = x; c.y = y;
    return hit;
  }
  const clampZ = (z) => Math.min(Z_MAX, Math.max(zMin(), z));
  function toMap(x, y) {
    return { mx: (x - frame.ulx) / frame.width * 512, my: (frame.uly - y) / frame.width * 512 };
  }
  // screen -> map, by the current camera
  function screenToMap(sx, sy) {
    return { x: cam.x + (sx - bigView.clientWidth / 2) / cam.z, y: cam.y + (sy - bigView.clientHeight / 2) / cam.z };
  }

  function buildBigMarkers() {
    bigPins.textContent = '';
    bigMarkers = [];
    if (!frame) return;
    for (const e of events) {
      const el = document.createElement('div');
      el.className = 'bigpin' + (iconStyle === 'native' ? ' native' : '');
      el.innerHTML = markup(e.icon);
      el.style.setProperty('--c', e.colour);
      const { mx, my } = toMap(e.wx, e.wy);
      el.style.left = (mx * WORLD) + 'px';
      el.style.top = (my * WORLD) + 'px';
      el.dataset.tip = e.label + '  -  click to set the GPS';
      el.dataset.wx = e.wx; el.dataset.wy = e.wy;
      el.dataset.kind = e.kind;
      if (e.kind === 'WAYPOINT') el.dataset.tip = 'Marker  -  double click to remove';
      bigPins.appendChild(el);
      bigMarkers.push(el);
    }
    meEl = document.createElement('div');
    meEl.className = 'bigarrow me';
    meEl.innerHTML = arrowSvg;
    bigPins.appendChild(meEl);
    rivalEls = [];
    bigZoomShown = -1;
    buildLegend();
  }


  function buildLegend() {
    const count = {};
    for (const e of events) count[e.kind] = (count[e.kind] || 0) + 1;
    const off = career && career.off ? career.off : [];
    const swatch = (colour, html, extra) => '<span class="sw' + (extra || '') + '" style="--c:' + colour + '">' + html + '</span>';
    const row = ([kind, name, cat], icon) => {
      const hidden = !!off[cat];
      return '<li class="nfs-row nfs-row--clickable' + (hidden ? ' off' : '') + '" data-cat="' + cat +
        '" data-on="' + (hidden ? 0 : 1) + '"><span class="nfs-check' + (hidden ? ' nfs-check--off' : '') + '">' +
        (hidden ? '' : '&#10003;') + '</span>' + swatch(colourOf(kind), markup(icon)) +
        '<span class="nfs-row__label">' + name + '</span><span class="nfs-row__value">' + (hidden ? '-' : (count[kind] || 0)) + '</span></li>';
    };
    const me = iconStyle === 'native' ? '#30cf30' : '#2ecc71', rv = iconStyle === 'native' ? '#cf8030' : '#f39c12';
    const arrow = (c) => arrowSvg.replace('<path', '<path fill="' + c + '"').replace('fill="white"', '');
    legendEl.innerHTML =
      '<li class="nfs-row nfs-row--head">' + swatch(me, arrow(me), ' arrow') + '<span class="nfs-row__label">Your car</span></li>' +
      '<li class="nfs-row nfs-row--head">' + swatch(rv, arrow(rv), ' arrow') + '<span class="nfs-row__label">Rival</span></li>' +
      '<li class="nfs-row nfs-row--head"><span class="nfs-row__label">Races</span></li>' +
      LEGEND_RACES.map((r) => row(r, 'RACE')).join('') +
      '<li class="nfs-row">' + swatch('#dfe6e9', markup('SPECIAL')) + '<span class="nfs-row__label">Special event</span></li>' +
      '<li class="nfs-row nfs-row--head"><span class="nfs-row__label">Shops</span></li>' +
      LEGEND_SHOPS.map((r) => row(r, r[0])).join('');
  }
  legendEl.addEventListener('click', (ev) => {
    const r = ev.target.closest('[data-cat]');
    if (!r) return;
    const on = r.dataset.on !== '1';
    frsmodloader.send('filter', { cat: +r.dataset.cat, on });
    sound(on ? 'valueRight' : 'valueLeft');
    ev.stopPropagation();
  });
  legendEl.addEventListener('pointerdown', (ev) => ev.stopPropagation());
  legendEl.addEventListener('mouseover', (ev) => {
    const r = ev.target.closest('[data-cat]');
    if (r === hoverRow) return;
    hoverRow = r;
    if (r) sound('down');
  });
  legendEl.addEventListener('mouseleave', () => { hoverRow = null; });

  function copyRoute() {
    const line = root.querySelector('.route-line');
    for (const [src, dst] of [[line, bigLine], [root.querySelector('.route-edge'), bigEdge]]) {
      dst.setAttribute('d', src.getAttribute('d') || '');
      dst.style.strokeDasharray = src.style.strokeDasharray;
      dst.style.strokeDashoffset = src.style.strokeDashoffset;
    }
  }

  function centerOnPlayer(z) {
    if (!lastPose || !frame) return;
    const { mx, my } = toMap(lastPose.x, lastPose.y);
    tcam.x = mx; tcam.y = my;
    if (z) tcam.z = clampZ(z);
  }

  function openBig() {
    bigOn = true;
    big.classList.add('on');
    big.classList.toggle('native', iconStyle === 'native');
    mm.style.visibility = 'hidden';
    bigImg.style.backgroundImage = bitmap.style.backgroundImage;
    buildBigMarkers();
    copyRoute();
    centerOnPlayer(Math.min(bigView.clientWidth, bigView.clientHeight) / 512 * 2.4);
    Object.assign(cam, tcam);
    vel.x = vel.y = 0;
    keys.clear();
    if (!bigRaf) bigRaf = requestAnimationFrame(bigFrame);
  }
  function closeBig() {
    bigOn = false;
    big.classList.remove('on');
    mm.style.visibility = '';
    bigTip.style.display = 'none';
    dragging = null;
  }

  function bigFrame() {
    bigRaf = 0;
    if (!bigOn) return;
    // keyboard: continuous pan while the key is held, zoom likewise
    const pan = KEY_PAN / cam.z;
    if (keys.has('arrowleft') || keys.has('a')) tcam.x -= pan;
    if (keys.has('arrowright') || keys.has('d')) tcam.x += pan;
    if (keys.has('arrowup') || keys.has('w')) tcam.y -= pan;
    if (keys.has('arrowdown') || keys.has('s')) tcam.y += pan;
    if (keys.has('+') || keys.has('=') || keys.has('e')) tcam.z = clampZ(tcam.z * KEY_ZOOM);
    if (keys.has('-') || keys.has('q')) tcam.z = clampZ(tcam.z / KEY_ZOOM);
    // drag inertia
    if (!dragging) {
      tcam.x += vel.x; tcam.y += vel.y;
      vel.x *= INERTIA; vel.y *= INERTIA;
    }
    tcam.z = clampZ(tcam.z);                  // the view may have been resized
    const hit = clampCam(tcam);
    if (hit.x) vel.x = 0;
    if (hit.y) vel.y = 0;
    cam.x += (tcam.x - cam.x) * CAM_EASE;
    cam.y += (tcam.y - cam.y) * CAM_EASE;
    cam.z += (tcam.z - cam.z) * CAM_EASE;
    clampCam(cam);                            // easing out of a zoom must not show the edge either
    const k = cam.z / WORLD;
    bigWorld.style.transform = 'translate(' + (bigView.clientWidth / 2 - cam.x * cam.z).toFixed(2) + 'px,' +
      (bigView.clientHeight / 2 - cam.y * cam.z).toFixed(2) + 'px) scale(' + k.toFixed(5) + ')';
    // the markers keep the same size: only rewritten when the zoom moves
    if (Math.abs(k - bigZoomShown) > 1e-4) {
      bigZoomShown = k;
      const inv = 'scale(' + (1 / k).toFixed(5) + ')';
      for (const el of bigMarkers) el.style.transform = inv;
      bigLine.style.strokeWidth = (1.5 * Math.max(1, 3 / cam.z)).toFixed(3);
      bigEdge.style.strokeWidth = (2.6 * Math.max(1, 3 / cam.z)).toFixed(3);
    }
    // player and rivals, north up: the heading h (0 = east) becomes 90 - h
    if (lastPose && frame && meEl) {
      const { mx, my } = toMap(lastPose.x, lastPose.y);
      meEl.style.transform = 'translate(' + (mx * WORLD) + 'px,' + (my * WORLD) + 'px) scale(' + (1 / k).toFixed(5) +
        ') rotate(' + (90 - lastPose.h * 180 / Math.PI).toFixed(1) + 'deg)';
      const rv = lastPose.rivals || [];
      while (rivalEls.length < rv.length) {
        const el = document.createElement('div');
        el.className = 'bigarrow rival';
        el.innerHTML = arrowSvg;
        bigPins.appendChild(el);
        rivalEls.push(el);
      }
      rivalEls.forEach((el, i) => {
        if (i >= rv.length) { el.style.display = 'none'; return; }
        const q = toMap(rv[i].x, rv[i].y);
        el.style.display = '';
        el.style.transform = 'translate(' + (q.mx * WORLD) + 'px,' + (q.my * WORLD) + 'px) scale(' + (1 / k).toFixed(5) +
          ') rotate(' + (90 - rv[i].h * 180 / Math.PI).toFixed(1) + 'deg)';
      });
    }
    bigRaf = requestAnimationFrame(bigFrame);
  }

  // mouse: drag (with inertia on release), wheel (zoom towards the cursor),
  // double click (zooms in there)
  bigView.addEventListener('pointerdown', (ev) => {
    // a click (no drag) on a pin sets the GPS there; the target is kept here
    // because, with the pointer captured, pointerup lands on bigView
    const pin = ev.target.closest && ev.target.closest('.bigpin');
    dragging = { x: ev.clientX, y: ev.clientY, t: performance.now(), pin, moved: 0 };
    vel.x = vel.y = 0;
    bigView.classList.add('drag');
    bigView.setPointerCapture(ev.pointerId);
  });
  bigView.addEventListener('pointermove', (ev) => {
    if (dragging) {
      dragging.moved += Math.abs(ev.clientX - dragging.x) + Math.abs(ev.clientY - dragging.y);
      const dx = (ev.clientX - dragging.x) / cam.z, dy = (ev.clientY - dragging.y) / cam.z;
      tcam.x -= dx; tcam.y -= dy;
      clampCam(tcam);
      cam.x = tcam.x; cam.y = tcam.y;    // the map follows the hand with no lag
      const now = performance.now(), dt = Math.max(1, now - dragging.t);
      vel.x = -dx * 16 / dt; vel.y = -dy * 16 / dt;
      dragging.x = ev.clientX; dragging.y = ev.clientY; dragging.t = now;
      bigTip.style.display = 'none';
      return;
    }
    const pin = ev.target.closest && ev.target.closest('.bigpin');
    if (pin !== hoverPin) { hoverPin = pin; if (pin) sound('down'); }
    if (pin && pin.dataset.tip) {
      bigTip.textContent = pin.dataset.tip;
      bigTip.style.display = 'block';
      const r = bigView.getBoundingClientRect();
      bigTip.style.transform = 'translate(' + (ev.clientX - r.left + 14) + 'px,' + (ev.clientY - r.top + 12) + 'px)';
    } else bigTip.style.display = 'none';
  });
  const CLICK_SLOP = 6;   // screen pixels: up to this it is a click, not a drag

  // The game's menu sounds (docs/UI-KIT.md, "Keyboard and sounds"): the
  // highlight moving onto another pin or legend row, a value changing (a
  // filter, the zoom), something that acts (the GPS, recentring), and "wrong"
  // for a zoom already at its end. Opening and closing are left to the game's
  // own map screen, which is underneath and sounds them itself.
  function sound(name) { try { frsmodloader.sound(name); } catch (e) {} }
  let hoverPin = null, hoverRow = null;
  function zoomStep(f) {
    const nz = clampZ(tcam.z * f);
    if (Math.abs(nz - tcam.z) < 1e-6) { sound('wrong'); return; }
    tcam.z = nz;
    sound(f > 1 ? 'valueRight' : 'valueLeft');
  }
  const endDrag = (ev) => {
    if (!dragging) return;
    // two clicks: on empty map a marker, on the marker it goes; on an event
    // pin a single click already set the GPS
    const onMarker = dragging.pin && dragging.pin.dataset.kind === 'WAYPOINT';
    if (dragging.moved < CLICK_SLOP && (!dragging.pin || onMarker) && ev && ev.type === 'pointerup') {
      const now = performance.now();
      if (lastClick && now - lastClick.t < DOUBLE_MS &&
          Math.hypot(ev.clientX - lastClick.x, ev.clientY - lastClick.y) < DOUBLE_PX) {
        lastClick = null;
        if (onMarker) clearWaypoint(); else placeWaypoint(ev.clientX, ev.clientY);
      } else lastClick = { t: now, x: ev.clientX, y: ev.clientY };
    } else lastClick = null;
    if (performance.now() - dragging.t > 80) vel.x = vel.y = 0;   // released while still: no inertia
    const pin = dragging.pin;
    if (pin && dragging.moved < CLICK_SLOP && pin.dataset.kind !== 'WAYPOINT') {
      vel.x = vel.y = 0;
      frsmodloader.send('gps', { x: +pin.dataset.wx, y: +pin.dataset.wy, from: streetNearCar() });
      sound('confirm');
    }
    dragging = null;
    bigView.classList.remove('drag');
  };
  bigView.addEventListener('pointerup', endDrag);
  bigView.addEventListener('pointercancel', endDrag);
  bigView.addEventListener('wheel', (ev) => {
    ev.preventDefault();
    const r = bigView.getBoundingClientRect();
    const sx = ev.clientX - r.left, sy = ev.clientY - r.top;
    const f = ev.deltaY < 0 ? WHEEL_STEP : 1 / WHEEL_STEP;
    const nz = clampZ(tcam.z * f);
    // the point under the cursor stays under the cursor: the target moves towards it
    const px = tcam.x + (sx - bigView.clientWidth / 2) / tcam.z, py = tcam.y + (sy - bigView.clientHeight / 2) / tcam.z;
    tcam.x = px - (sx - bigView.clientWidth / 2) / nz;
    tcam.y = py - (sy - bigView.clientHeight / 2) / nz;
    tcam.z = nz;
  }, { passive: false });
  // A double click puts the player's marker there and sends the GPS to it.
  // The loader hands every click to the page with a click count of 1, so the
  // browser never raises dblclick: two clicks close in time and place are
  // told apart here (endDrag).
  const DOUBLE_MS = 400, DOUBLE_PX = 8;
  const WAYPOINT_TRIES = 5;   // streets tried around a marker, nearest first
  // main.js moved on to another street, or ran out of them
  frsmodloader.on('waypoint-target', (t) => { if (waypoint && t) { waypoint.tx = t.x; waypoint.ty = t.y; } });
  frsmodloader.on('waypoint-failed', () => {
    if (!waypoint || waypoint.routed) return;
    waypoint = null;
    placeEvents();
    sound('wrong');
  });
  let lastClick = null;
  function clearWaypoint() {
    if (!waypoint) return;
    waypoint = null;
    route = null;
    frsmodloader.send('waypoint-clear');
    placeEvents();
    drawRoute();
    sound('valueLeft');
  }
  function placeWaypoint(clientX, clientY) {
    if (!frame || !track || track.id !== FREE_ROAM) return;
    const r = bigView.getBoundingClientRect();
    const p = screenToMap(clientX - r.left, clientY - r.top);
    const x = frame.ulx + p.x / 512 * frame.width, y = frame.uly - p.y / 512 * frame.width;
    // where the GPS may go: the nearest point of each of the nearest streets,
    // closest first; main.js tries the next when the GPS finds no way there
    const targets = [];
    if (streets) {
      for (const id in streets) {
        const q = streets[id];
        let bi = 0, bd = Infinity;
        for (let i = 0; i < q.length; i += 2) {
          const d = (q[i] - x) ** 2 + (q[i + 1] - y) ** 2;
          if (d < bd) { bd = d; bi = i; }
        }
        targets.push({ x: q[bi], y: q[bi + 1], street: +id, idx: bi / 2, d: bd });
      }
      targets.sort((a, b) => a.d - b.d);
      targets.length = Math.min(targets.length, WAYPOINT_TRIES);
    }
    if (!targets.length) targets.push({ x, y, d: 0 });
    waypoint = { x, y, tx: targets[0].x, ty: targets[0].y, routed: false };
    placeEvents();
    frsmodloader.send('waypoint', { targets: targets.map((t) => ({ x: t.x, y: t.y, street: t.street, idx: t.idx })),
                                    from: streetNearCar() });
    sound('confirm');
  }
  window.addEventListener('keydown', (ev) => {
    if (!bigOn) return;
    const k = ev.key.toLowerCase();
    if (k === 'escape' || k === 'm') { frsmodloader.send('bigmap-close'); ev.preventDefault(); return; }
    if (k === 'c' || k === ' ') { centerOnPlayer(); sound('confirm'); ev.preventDefault(); return; }
    keys.add(k);
    ev.preventDefault();
  });
  window.addEventListener('keyup', (ev) => keys.delete(ev.key.toLowerCase()));

  root.getElementById('bigback').addEventListener('click', () => frsmodloader.send('bigmap-close'));
  root.getElementById('bigcenter').addEventListener('click', () => { centerOnPlayer(); sound('confirm'); });
  const BTN_ZOOM = 1.6;
  root.getElementById('bigzin').addEventListener('click', () => zoomStep(BTN_ZOOM));
  root.getElementById('bigzout').addEventListener('click', () => zoomStep(1 / BTN_ZOOM));
  root.getElementById('bigrecenter').addEventListener('click', () => { centerOnPlayer(); sound('confirm'); });
  // the highlight moving onto a button
  for (const id of ['bigback', 'bigcenter', 'bigzin', 'bigzout', 'bigrecenter'])
    root.getElementById(id).addEventListener('mouseenter', () => sound('right'));
  // the buttons do not start a drag on the map
  for (const id of ['bigback', 'bigcenter', 'bigzin', 'bigzout', 'bigrecenter'])
    root.getElementById(id).addEventListener('pointerdown', (ev) => ev.stopPropagation());
  frsmodloader.on('bigmap', (on) => { if (on) openBig(); else closeBig(); });

  frsmodloader.send('ready');
</script>
